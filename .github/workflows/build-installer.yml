name: Build installer

# Builds the Windows installer the same way a release build is meant to happen: from a clean
# checkout, on a GitHub-hosted runner, with no manual intervention. This is also a real
# requirement, not just good practice -- SignPath Foundation's free tier (see
# docs/SIGNING-POLICY.md) requires every job leading up to a signing request to run on
# GitHub-hosted runners, never self-hosted.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # A solution-wide `dotnet restore` (no explicit -r) does NOT reliably pull the win-x64
      # runtime pack into the restore graph even though Win4K.ScreenSaver.csproj pins
      # RuntimeIdentifier=win-x64 statically -- confirmed by two consecutive CI failures after
      # trying exactly that; a dev machine never hits this because its NuGet cache is already
      # warmed from months of prior `-r win-x64` restores, which CI's starts without. Restoring
      # the screensaver project directly, WITH an explicit -r win-x64, is what actually forces
      # the runtime-pack restore path (the well-documented fix for NETSDK1112 in CI).
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Win4KScreensavers.slnx
          dotnet restore src\Win4K.ScreenSaver\Win4K.ScreenSaver.csproj -r win-x64

      - name: Run tests
        shell: pwsh
        run: dotnet test -c Release --no-restore

      # A build-time input to dotnet publish (Win4K.Core.csproj only flows it into the build if
      # the file already exists), so this has to happen before the next step -- same order
      # scripts/build-installer.ps1 itself documents and relies on.
      - name: Fetch libmpv
        shell: pwsh
        env:
          # Raises fetch-libmpv.ps1's api.github.com call from the 60/hour unauthenticated,
          # shared-IP limit (which actual CI runs confirmed gets exhausted by unrelated Actions
          # traffic) to a 5,000/hour pool scoped to this job's own token.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-libmpv.ps1

      # Same reason: the csproj copies native\ffmpeg\ into the publish only if it already exists.
      - name: Fetch ffmpeg
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/fetch-ffmpeg.ps1

      # Publishes (both the loose multi-file build and the separate System32 one-file .scr),
      # sanity-checks the result, finds or installs Inno Setup, compiles the installer, and
      # (step 6) writes a plain-text .sha256 sidecar of the compiled installer -- the exact same
      # script a human runs locally, so CI can never silently diverge from it.
      - name: Build installer
        shell: pwsh
        run: ./scripts/build-installer.ps1

      # Both files ship in one artifact so they land together: the auto-updater
      # (Win4K.Core.Updates.UpdateInstaller) verifies a downloaded installer against the
      # .sha256's hash -- published IN THE RELEASE, not GitHub's own per-asset `digest` -- so
      # when this build is attached to a GitHub Release, the .sha256 goes up as its own second
      # asset right alongside the .exe, not just kept as a CI-internal artifact.
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: Win4KSS-installer
          path: |
            installer/output/*.exe
            installer/output/*.sha256
          retention-days: 30
          if-no-files-found: error

      # TODO: once accepted into SignPath Foundation (see docs/SIGNING-POLICY.md), submit the
      # artifact above for signing here, e.g.:
      #
      #   - name: Submit for signing
      #     uses: signpath/github-action-submit-signing-request@v3  # check docs.signpath.io for the current version at setup time
      #     with:
      #       api-token: "${{ secrets.SIGNPATH_API_TOKEN }}"
      #       organization-id: "<signpath-org-id>"
      #       project-slug: "win4kss"
      #       signing-policy-slug: "release-signing"
      #       artifact-configuration-slug: "installer"
      #       github-artifact-id: "${{ steps.upload-installer.outputs.artifact-id }}"
      #       wait-for-completion: true
      #       output-artifact-directory: "signed"
      #
      # Needs: the upload step above given an explicit `id:` so its artifact-id output can be
      # referenced, the real organization-id/signing-policy-slug/artifact-configuration-slug
      # from the SignPath project once it exists, and SIGNPATH_API_TOKEN added as a repository
      # secret. Publishing the signed result as a GitHub Release is a separate step to add once
      # this is live.
