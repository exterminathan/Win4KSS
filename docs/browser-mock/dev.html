<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win4KSS (dev harness)</title>
<link rel="stylesheet" href="../../src/Win4K.ScreenSaver/Browser/ui/app.css">
<style>
  /* Dev-only banner so this is never mistaken for the shipped page. */
  #dev-banner {
    flex: 0 0 auto;
    background: #4a1f8f;
    color: #fff;
    font: 12px/24px -apple-system, "Segoe UI", sans-serif;
    padding: 0 10px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #dev-banner b { font-weight: 600; }
  html, body { height: 100%; margin: 0; }
  #dev-root { display: flex; flex-direction: column; height: 100%; }
  #dev-root .app { flex: 1 1 auto; min-height: 0; height: auto; }
</style>
</head>
<body>
<!--
  The no-WebView2 dev harness (docs/browser-bridge-contract.md, "Build/test approach").
  Serve the REPO ROOT over HTTP (`python -m http.server`, then open
  /docs/browser-mock/dev.html): this page fetches the real index.html, lifts its #app markup
  in, and then loads the real app.js, so there is exactly one copy of the page. shim.js
  (loaded first) stands in for window.chrome.webview and replays fixture.json when the page
  posts `ready`. Nothing here is embedded or served by the app: the csproj embeds only
  src/Win4K.ScreenSaver/Browser/ui/**.
-->
<div id="dev-root">
  <div id="dev-banner">
    <b>DEV HARNESS</b> &mdash; mock bridge (shim.js + fixture.json), not the real WebView2 host.
    Open devtools and watch the console for page&harr;host message logs.
  </div>
</div>

<script src="shim.js"></script>
<script>
  (async function () {
    const UI = '../../src/Win4K.ScreenSaver/Browser/ui/';
    const html = await (await fetch(UI + 'index.html')).text();
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.getElementById('dev-root').appendChild(document.importNode(doc.getElementById('app'), true));
    const script = document.createElement('script');
    script.src = UI + 'app.js';
    document.body.appendChild(script);
  })().catch((err) => console.error('[dev] could not load the UI -- serve the repo root over HTTP', err));
</script>
</body>
</html>
