<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win4KSS</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!--
  Served by BrowserForm from embedded resources on https://app.win4k/ (WebResourceRequested;
  see Browser/UiAssets.cs). It talks to the host only through window.chrome.webview
  (PostWebMessageAsJson / WebMessageReceived); the message shapes are in
  docs/browser-bridge-contract.md.

  Almost everything below is static scaffolding. The dynamic content -- facet lists, the
  card grid, the detail pane, the settings tabs -- is built by app.js. The dev harness
  (docs/browser-mock/dev.html) loads THIS file's #app markup at runtime, so there is one copy
  of it. Never reference the dev shim from here.
-->
<div id="app" class="app">

  <header id="toolbar" class="toolbar">
    <button id="toggle-sidebar" type="button" class="icon-btn toggle-sidebar" title="Filters" aria-label="Show filters">☰</button>
    <div class="toolbar-group toolbar-search">
      <input id="search-input" type="search" placeholder="Search clips…" aria-label="Search clips" autocomplete="off">
    </div>

    <div class="toolbar-group">
      <label class="toolbar-label" for="sort-select">Sort</label>
      <select id="sort-select" aria-label="Sort clips by">
        <option value="title:asc">Name (A–Z)</option>
        <option value="title:desc">Name (Z–A)</option>
        <option value="durationSeconds:desc">Duration (longest)</option>
        <option value="durationSeconds:asc">Duration (shortest)</option>
        <option value="sizeBytes:desc">Size (largest)</option>
        <option value="sizeBytes:asc">Size (smallest)</option>
        <option value="resolution:desc">Resolution (highest)</option>
        <option value="addedUtc:desc" selected>Date added (newest)</option>
        <option value="addedUtc:asc">Date added (oldest)</option>
        <option value="lastPlayed:desc">Last played</option>
        <option value="source:asc">Source</option>
      </select>
    </div>

    <div class="toolbar-group toolbar-viewsize" role="group" aria-label="Card size">
      <button type="button" class="icon-btn viewsize-btn" data-size="s" title="Small cards">S</button>
      <button type="button" class="icon-btn viewsize-btn is-active" data-size="m" title="Medium cards">M</button>
      <button type="button" class="icon-btn viewsize-btn" data-size="l" title="Large cards">L</button>
    </div>

    <button id="select-all-filtered" type="button" class="btn">Select all filtered</button>

    <div class="toolbar-spacer"></div>

    <div id="refresh-spinner" class="spinner hidden" title="Refreshing catalogues…" aria-hidden="true"></div>
    <span id="refresh-status" class="refresh-status hidden" aria-live="polite"></span>
    <button id="refresh-catalogs" type="button" class="btn" title="Re-harvest the Internet Archive, NASA and aerial-manifest catalogues">Refresh catalogues</button>
    <button id="start-now" type="button" class="btn btn-accent" title="Start the screen saver now">Start now</button>
    <button id="open-settings" type="button" class="icon-btn" title="Settings" aria-label="Open settings">⚙</button>
  </header>

  <div id="body" class="body">
    <aside id="sidebar" class="sidebar" aria-label="Filters">
      <div class="sidebar-head">
        <h2>Filters</h2>
        <button id="clear-filters" type="button" class="link-btn">Clear all</button>
      </div>
      <div id="facet-list" class="facet-list"><!-- populated by app.js: one .facet-group per TagFacet --></div>
    </aside>

    <main id="grid-wrap" class="grid-wrap">
      <div id="grid-status" class="grid-status" aria-live="polite"></div>
      <div id="grid" class="grid grid-m" role="list"><!-- populated by app.js: one .card per clip --></div>
      <div id="grid-loading" class="grid-empty"><div class="spinner spinner-lg"></div>Loading the catalogue…</div>
      <div id="grid-empty" class="grid-empty hidden">No clips match these filters.</div>
    </main>

    <aside id="detail" class="detail hidden" aria-label="Clip detail">
      <div class="detail-head">
        <h2 id="detail-title" class="detail-title"></h2>
        <button id="detail-close" type="button" class="icon-btn detail-close" aria-label="Close detail pane" title="Close (Esc)">✕</button>
      </div>

      <div id="detail-preview" class="detail-preview">
        <!--
          detail-preview-rect is the exact box BrowserForm lays its native mpv HWND over
          (panelRect carries its viewport rect). The HWND draws above everything, so nothing
          may overlap this box -- keep buttons out of it. The still underneath shows until
          mpv paints, and in the dev harness, where there is no native panel.
        -->
        <div id="detail-preview-rect" class="detail-preview-rect">
          <div id="detail-preview-placeholder" class="detail-preview-placeholder"></div>
          <img id="detail-preview-img" class="detail-preview-media hidden" alt="">
        </div>
      </div>

      <div class="detail-body">
        <div id="detail-meta" class="detail-meta"></div>

        <button id="detail-play-now" type="button" class="btn btn-accent detail-play-now" title="Start the screen saver now, opening with this clip">▶ Play now</button>

        <div class="detail-toggles">
          <label class="switch-row">
            <span class="switch">
              <input id="toggle-rotation" type="checkbox">
              <span class="switch-track"></span>
            </span>
            <span class="switch-label">In rotation</span>
          </label>
          <label class="switch-row">
            <span class="switch">
              <input id="toggle-pin" type="checkbox">
              <span class="switch-track"></span>
            </span>
            <span class="switch-label">Keep offline</span>
          </label>
          <div id="detail-download" class="detail-download hidden">
            <div id="detail-download-text"></div>
            <div id="detail-download-bar" class="progress-bar hidden"><div></div></div>
            <button id="detail-download-retry" type="button" class="link-btn hidden">Retry failed downloads</button>
          </div>
        </div>

        <div id="detail-captions" class="detail-captions"></div>
        <p id="detail-description" class="detail-description hidden"></p>
        <p id="detail-credit" class="detail-credit hidden"></p>

        <div id="detail-tags" class="detail-tags"></div>
      </div>
    </aside>
  </div>

  <div id="bulk-bar" class="bulk-bar hidden">
    <span id="bulk-count" class="bulk-count"></span>
    <div class="bulk-actions">
      <button id="bulk-rotation-on" type="button" class="btn">Add to rotation</button>
      <button id="bulk-rotation-off" type="button" class="btn">Remove from rotation</button>
      <button id="bulk-pin-on" type="button" class="btn">Keep offline</button>
      <button id="bulk-pin-off" type="button" class="btn">Stop keeping offline</button>
    </div>
    <button id="bulk-clear" type="button" class="link-btn">Clear selection</button>
  </div>

  <div id="settings-overlay" class="overlay hidden" role="dialog" aria-modal="true" aria-label="Settings">
    <div class="settings-panel">
      <div class="settings-head">
        <h2>Settings</h2>
        <button id="settings-close" type="button" class="icon-btn" aria-label="Close settings">✕</button>
      </div>
      <div class="settings-body">
        <nav id="settings-tabs" class="settings-tabs" role="tablist">
          <button type="button" class="settings-tab is-active" data-tab="sources" role="tab">Sources</button>
          <button type="button" class="settings-tab" data-tab="playback" role="tab">Playback</button>
          <button type="button" class="settings-tab" data-tab="cache" role="tab">Cache</button>
          <button type="button" class="settings-tab" data-tab="trigger" role="tab">Start now</button>
          <button type="button" class="settings-tab" data-tab="about" role="tab">About</button>
        </nav>
        <div id="settings-panes" class="settings-panes">
          <section class="settings-pane is-active" data-tab="sources"></section>
          <section class="settings-pane" data-tab="playback"></section>
          <section class="settings-pane" data-tab="cache"></section>
          <section class="settings-pane" data-tab="trigger"></section>
          <section class="settings-pane" data-tab="about"></section>
        </div>
      </div>
    </div>
  </div>

  <div id="confirm-overlay" class="overlay confirm-overlay hidden" role="alertdialog" aria-modal="true">
    <div class="confirm-panel">
      <p id="confirm-message" class="confirm-message"></p>
      <div id="confirm-extra" class="confirm-extra hidden"></div>
      <div id="confirm-actions" class="confirm-actions"></div>
    </div>
  </div>

  <div id="toast-host" class="toast-host" aria-live="assertive"></div>
</div>

<script src="app.js"></script>
</body>
</html>
